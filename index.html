<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ホワイトボードAR</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    /* マーカーを認識した時に画面上に表示するオーバーレイ表 */
    #ar-overlay {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.9);
      color: #ffffff;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #38bdf8;
      max-width: 90vw;
      max-height: 80vh;
      overflow: auto;
      z-index: 9999;
      font-family: sans-serif;
      font-size: 11px;
    }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #334155; padding: 4px 6px; text-align: center; white-space: nowrap; }
    th { background-color: #1e293b; color: #38bdf8; }
    .status-msg {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: #00ffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: sans-serif;
      z-index: 9999;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- 画面上部のステータス表示 -->
  <div id="status" class="status-msg">データ読み込み中...</div>

  <!-- マーカー検出時に出るデータ表 -->
  <div id="ar-overlay">
    <div style="font-weight:bold; color:#38bdf8; margin-bottom:6px; font-size:13px;">【成約サポーター 予測表】</div>
    <table id="data-table"></table>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro" id="marker">
      <!-- マーカー位置の目安用3D枠 -->
      <a-box position="0 0 0" scale="0.2 0.2 0.2" color="#00FFFF"></a-box>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzbWYr52YNpMvvKEBlySHfeBjH6ZRzWYwKRzoy0rIXHkofOTsk_EbqjS8ZALAS7-BA0PQ/exec";

    // 1. データ取得
    fetch(GAS_URL)
      .then(res => res.json())
      .then(data => {
        document.getElementById("status").textContent = "Hiroマーカーをカメラにかざしてください";
        
        const table = document.getElementById("data-table");
        table.innerHTML = "";

        // 59行目〜83行目（index: 58〜82）、P列〜AD列（index: 15〜29）を抽出して表を作成
        for (let r = 58; r <= 82; r++) {
          if (!data[r]) continue;
          const tr = document.createElement("tr");
          
          for (let c = 15; c <= 29; c++) {
            let val = data[r][c];
            if (val === undefined || val === null) val = "";
            if (typeof val === "number") val = Math.round(val).toLocaleString();

            const td = document.createElement(r === 58 || r === 66 || r === 74 ? "th" : "td");
            td.textContent = val;
            tr.appendChild(td);
          }
          table.appendChild(tr);
        }
      })
      .catch(err => {
        document.getElementById("status").textContent = "通信エラーが発生しました";
        console.error(err);
      });

    // 2. マーカー認識時の表示切り替え
    const marker = document.getElementById("marker");
    const overlay = document.getElementById("ar-overlay");

    marker.addEventListener("markerFound", () => {
      overlay.style.display = "block";
    });

    marker.addEventListener("markerLost", () => {
      overlay.style.display = "none";
    });
  </script>

</body>
</html>

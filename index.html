<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ホワイトボードAR</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <a-entity id="ar-container" position="-1.5 0.5 -1" rotation="-90 0 0">
        <a-text id="status-text" value="Loading..." color="red" position="1.5 0 0" scale="2 2 2"></a-text>
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyd6mxiXuzvalDY4tsrAyhBHs2dyQmUIWjUWtxTmaNGIMQN7oP2OJShfrF3osazSCqOmQ/exec";

    // GASのリダイレクト(CORS)に対応したfetch設定
    fetch(GAS_URL, {
      method: "GET",
      mode: "cors",
      redirect: "follow"
    })
      .then(response => {
        if (!response.ok) {
          throw new Error("HTTPエラー: " + response.status);
        }
        return response.json();
      })
      .then(data => {
        const container = document.getElementById("ar-container");
        container.innerHTML = ""; // Loadingを消去

        let yOffset = 0;

        // 59行目〜83行目（index: 58〜82）、P列〜AD列（index: 15〜29）を取得
        for (let r = 58; r <= 82; r++) {
          if (!data[r]) continue;

          let lineStr = "";
          for (let c = 15; c <= 29; c++) {
            let val = data[r][c];
            if (val === undefined || val === null) val = "";
            if (typeof val === "number") val = Math.round(val).toLocaleString();
            
            lineStr += String(val).slice(0, 8).padEnd(9, " ");
          }

          if (lineStr.trim().length > 0) {
            const textEl = document.createElement("a-text");
            textEl.setAttribute("value", lineStr);
            textEl.setAttribute("position", `0 ${-yOffset} 0`);
            textEl.setAttribute("font", "monospace");
            
            if (r === 58 || r === 66 || r === 74) {
              textEl.setAttribute("color", "#FFD700");
              textEl.setAttribute("scale", "0.7 0.7 0.7");
            } else {
              textEl.setAttribute("color", "#00FFFF");
              textEl.setAttribute("scale", "0.5 0.5 0.5");
            }

            container.appendChild(textEl);
            yOffset += 0.18;
          }
        }
      })
      .catch(error => {
        console.error("エラー詳細:", error);
        const statusText = document.getElementById("status-text");
        if (statusText) {
          statusText.setAttribute("value", "Data Load Error");
          statusText.setAttribute("scale", "1.5 1.5 1.5");
        }
      });
  </script>

</body>
</html>
